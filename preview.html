<style>
  .ftbr-section{
    --ftbr-bg: transparent;
    --ftbr-card: #fffdf6;
    --ftbr-ink: #37342a;
    --ftbr-muted: #8f8a76;
    --ftbr-line: #e7e2d1;
    --ftbr-star: #b3a13a;
    --ftbr-accent: #7c7e50;
    /* The site sets kepler-std on its own elements rather than on <body>,
       so inheriting would land us on the browser default. */
    --ftbr-font: "kepler-std", Georgia, "Times New Roman", serif;
    background: var(--ftbr-bg);
    padding: 64px 0 72px;
    width: 100%;
    overflow: hidden;
    font-family: var(--ftbr-font);
  }
  .ftbr-head{ text-align:center; margin:0 auto 8px; max-width:90%; }
  .ftbr-title{
    font-family: var(--ftbr-font);
    font-size: clamp(1.7rem, 3.4vw, 2.6rem);
    line-height:1.15; color:var(--ftbr-ink); margin:0 0 10px; font-weight:400;
  }
  .ftbr-sub{ color:var(--ftbr-muted); font-size:0.95rem; margin:0 0 4px; letter-spacing:.02em; }
  .ftbr-sub a{ color:var(--ftbr-accent); text-decoration:none; border-bottom:1px solid transparent; }
  .ftbr-sub a:hover{ border-bottom-color:var(--ftbr-accent); }

  .ftbr-viewport{ position:relative; margin-top:34px; -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); }
  .ftbr-track{ display:flex; width:max-content; gap:22px; padding:8px 11px; will-change:transform; animation:ftbr-scroll var(--ftbr-duration,60s) linear infinite; }
  .ftbr-viewport:hover .ftbr-track{ animation-play-state:paused; }
  @keyframes ftbr-scroll{ from{ transform:translate3d(0,0,0);} to{ transform:translate3d(-50%,0,0);} }

  .ftbr-card{
    flex:0 0 auto; width:340px; box-sizing:border-box;
    background:var(--ftbr-card); border:1px solid var(--ftbr-line);
    border-radius:16px; padding:26px 26px 22px;
    box-shadow:0 10px 30px -18px rgba(60,55,35,.5);
    display:flex; flex-direction:column;
  }
  /* Rating: five glyphs, each empty, half or full, plus the exact score. */
  .ftbr-rating{ display:flex; align-items:center; justify-content:center; gap:9px; margin:0 auto 16px; }
  .ftbr-stars{ display:inline-flex; font-size:17px; line-height:1; }
  .ftbr-star{ position:relative; display:inline-block; width:1em; height:1em; margin-right:3px; color:#ded9c4; }
  .ftbr-star:last-child{ margin-right:0; }
  .ftbr-star::before{ content:"★"; position:absolute; left:0; top:0; line-height:1; }
  .ftbr-star.is-full{ color:var(--ftbr-star); }
  .ftbr-star.is-half::after{ content:"★"; position:absolute; left:0; top:0; width:.5em; overflow:hidden; color:var(--ftbr-star); line-height:1; }
  .ftbr-score{ color:var(--ftbr-muted); font-size:.85rem; line-height:1; font-variant-numeric:tabular-nums; }
  .ftbr-quote{
    color:var(--ftbr-ink); font-size:1.02rem; font-weight:300; line-height:1.6; margin:0 0 22px;
    text-align:center; flex:1 1 auto;
    display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; overflow:hidden;
  }
  .ftbr-who{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:auto; }
  .ftbr-avatar{ width:52px; height:52px; border-radius:50%; background:#ece8da; display:flex; align-items:center; justify-content:center; }
  .ftbr-avatar svg{ width:52px; height:52px; display:block; }
  .ftbr-name{ font-weight:500; color:var(--ftbr-ink); font-size:.98rem; }
  .ftbr-meta{ color:var(--ftbr-muted); font-size:.8rem; letter-spacing:.02em; }

  @media (max-width:640px){ .ftbr-card{ width:280px; } .ftbr-section{ padding:48px 0 54px; } }

  @media (prefers-reduced-motion: reduce){
    .ftbr-viewport{ overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; }
    .ftbr-track{ animation:none; }
    .ftbr-card{ scroll-snap-align:center; }
    .ftbr-dup{ display:none; }
  }
</style>
<script>
(function () {
  "use strict";

  // ---- CONFIG ---------------------------------------------------------------
  var RAW_URL = "https://raw.githubusercontent.com/pjithorpe/cuilcheanna-reviews/master/reviews.json";
  var TITLE   = "Kind Words from Our Guests";
  var SUBLINK = "https://www.freetobook.com/reviews/all?w_id=50548&w_tkn=4fkenhRxXnPtna2JOE3gjBZewnvLblGyDiQwp8stAIAAoCuGjEGMrOmoe4elD";
  var MAX_CARDS  = 18;   // most-recent N reviews that pass the filters
  var MIN_RATING = 4.5;  // 4.5 stars and above
  var MIN_CHARS  = 0;    // set >0 to hide very short comments
  // ---------------------------------------------------------------------------

  var AVATAR = '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<circle cx="24" cy="24" r="24" fill="#e6e1d2"/>'
    + '<circle cx="24" cy="19" r="8" fill="#b9b39d"/>'
    + '<path d="M9 42c1.6-8.4 8-13 15-13s13.4 4.6 15 13a24 24 0 0 1-30 0z" fill="#b9b39d"/></svg>';

  var cached = null;  // reviews, kept across client-side page changes

  function esc(s){ return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

  // Stars are drawn to the nearest half; the exact score sits beside them.
  function ratingHTML(rating){
    var val = Number(rating);
    if (!isFinite(val) || val <= 0) return "";
    var half = Math.round(val * 2) / 2, stars = "";
    for (var i = 1; i <= 5; i++) {
      stars += '<span class="ftbr-star '
        + (half >= i ? "is-full" : (half >= i - 0.5 ? "is-half" : ""))
        + '"></span>';
    }
    return '<div class="ftbr-rating">'
      + '<span class="ftbr-stars" role="img" aria-label="' + val.toFixed(1) + ' out of 5">'
      + stars + '</span>'
      + '<span class="ftbr-score" aria-hidden="true">' + val.toFixed(1) + '</span>'
      + '</div>';
  }

  function cardHTML(r, dup){
    return '<figure class="ftbr-card' + (dup ? ' ftbr-dup' : '') + '"'
      + (dup ? ' aria-hidden="true"' : '') + '>'
      + ratingHTML(r.rating)
      + '<blockquote class="ftbr-quote">' + esc(r.comment) + '</blockquote>'
      + '<figcaption class="ftbr-who">'
      + '<span class="ftbr-avatar">' + AVATAR + '</span>'
      + '<span class="ftbr-name">' + esc(r.name || "Guest") + '</span>'
      + (r.date ? '<span class="ftbr-meta">' + esc(r.date) + ' · Verified stay</span>'
                : '<span class="ftbr-meta">Verified stay</span>')
      + '</figcaption></figure>';
  }

  function build(mount, reviews){
    reviews = (reviews || []).filter(function(r){
      return r && r.comment && r.comment.length >= MIN_CHARS
        && Number(r.rating) >= MIN_RATING;
    }).slice(0, MAX_CARDS);
    if (!reviews.length) return;

    var cards = reviews.map(function(r){ return cardHTML(r, false); }).join("");
    var dups  = reviews.map(function(r){ return cardHTML(r, true); }).join("");

    var section = document.createElement("section");
    section.className = "ftbr-section";
    section.innerHTML =
      '<div class="ftbr-head">'
      +   '<h2 class="ftbr-title">' + esc(TITLE) + '</h2>'
      +   '<p class="ftbr-sub"><a href="' + esc(SUBLINK) + '" target="_blank" rel="noopener">'
      +       'Read all our reviews →</a></p>'
      + '</div>'
      + '<div class="ftbr-viewport"><div class="ftbr-track">' + cards + dups + '</div></div>';

    mount.innerHTML = "";
    mount.appendChild(section);

    // Duration scales with card count so speed stays consistent.
    var track = section.querySelector(".ftbr-track");
    track.style.setProperty("--ftbr-duration", Math.max(30, reviews.length * 6) + "s");
  }

  // The marker Code Block decides where this renders. No marker, no section.
  function getMount(){
    return document.getElementById("ftb-reviews");
  }

  function start(){
    var mount = getMount();
    if (!mount || mount.getAttribute("data-ftbr-done")) return;
    mount.setAttribute("data-ftbr-done", "1");

    if (window.FTB_REVIEWS_SAMPLE) { build(mount, window.FTB_REVIEWS_SAMPLE); return; }
    if (cached) { build(mount, cached); return; }

    fetch(RAW_URL, { cache: "no-store" })
      .then(function(res){ if(!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function(data){ cached = (data && data.reviews) || data; build(mount, cached); })
      .catch(function(err){ /* fail quietly: no broken section */ console && console.warn("[ftbr]", err); });
  }

  // Squarespace swaps pages client-side, which replaces the marker element
  // without firing DOMContentLoaded — so re-check on navigation and whenever
  // the DOM changes. start() is idempotent via the data-ftbr-done flag.
  var pending = null;
  function restart(){
    if (pending) return;
    pending = setTimeout(function(){ pending = null; start(); }, 150);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();

  window.addEventListener("mercury:load", restart);
  window.addEventListener("popstate", restart);
  if (window.MutationObserver && document.body) {
    new MutationObserver(function(){
      var mount = document.getElementById("ftb-reviews");
      if (mount && !mount.getAttribute("data-ftbr-done")) restart();
    }).observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
